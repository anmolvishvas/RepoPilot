target-version = "py311"
line-length = 100

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "RUF",    # Ruff-specific rules
    "ASYNC",  # flake8-async
    "T20",    # flake8-print
]
ignore = [
    "E501",   # line length violations handled by formatter
]

[lint.isort]
known-first-party = ["repopilot"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
