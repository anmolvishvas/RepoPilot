[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repopilot"
version = "0.1.0"
description = "Autonomous Codebase Modernization & Migration Agent powered by FastMCP, Tree-sitter Code-Graph RAG, and Self-Healing LangGraph State Machines."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Anmol Vishvas", email = "anmol23vishvas@gmail.com" }
]
keywords = [
    "ast",
    "tree-sitter",
    "rag",
    "mcp",
    "fastmcp",
    "langgraph",
    "code-modernization",
    "refactoring",
    "self-healing",
    "codebase-agent"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "fastmcp>=0.1.0",
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.21.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.7.0",
    "qdrant-client>=1.9.0",
    "fastembed>=0.3.0",
    "rank-bm25>=0.2.2",
    "flashrank>=0.2.0",
    "docker>=7.0.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "sse-starlette>=2.1.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "networkx>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "pip-audit>=2.7.0",
    "bandit>=1.7.8",
    "types-setuptools>=69.5.0",
]

[project.scripts]
repopilot = "repopilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/repopilot"]
